services:
  nesthealth:
    image: hansford909/nesthealth-server:latest
    # To build from the source code instead, replace the line above with:  build: .
    container_name: nesthealth
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/London   # used for the times shown in notifications
      # The HTTPS address your family uses, if you have one (needed for passkeys behind a proxy):
      # - PUBLIC_URL=https://health.example.com
    volumes:
      - nesthealth-data:/data   # the database and photos

volumes:
  nesthealth-data:
